name: nirogx_mobile
description: NirogX Clinical Intelligence & Health Data Sync Mobile Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.2

  # Health Data Synchronization (Android Health Connect & Apple HealthKit)
  health: ^12.0.0
  permission_handler: ^11.3.1

  # HTTP & Networking
  http: ^1.2.1
  dio: ^5.4.3+1

  # Local Persistence & Secure Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
  crypto: ^3.0.3

  # UI, Icons, Charts & Animations
  cupertino_icons: ^1.0.8
  lucide_icons: ^0.257.0
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
