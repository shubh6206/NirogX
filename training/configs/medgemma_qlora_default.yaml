model:
  name: "google/medgemma-1.5-4b-it"
  torch_dtype: "bfloat16"
  trust_remote_code: true

quantization:
  enabled: true
  quant_type: "nf4"
  use_double_quant: true
  compute_dtype: "bfloat16"

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  output_dir: "models/nirogx-medgemma-4b-v0.1"
  num_train_epochs: 2
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.05
  logging_steps: 10
  eval_strategy: "steps"
  eval_steps: 50
  save_strategy: "epoch"
  max_seq_length: 4096
  fp16: false
  bf16: true
  seed: 42

dataset:
  version: "nirogx-medical-dataset-v0.1"
  train_path: "datasets/pilot/train.json"
  val_path: "datasets/pilot/val.json"
  test_path: "datasets/pilot/test.json"
